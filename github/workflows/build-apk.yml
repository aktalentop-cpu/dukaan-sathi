name: Build Dukaan Sathi APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project files
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -o "project-bolt-sb1-vcmwzvp7 (4).zip" -d extracted
          find extracted -name package.json -print

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Find project directory
        run: |
          PROJECT_DIR="$(dirname "$(find "$GITHUB_WORKSPACE/extracted" -name package.json -print -quit)")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: cd "$PROJECT_DIR" && npm ci

      - name: Build web app
        run: cd "$PROJECT_DIR" && npm run build

      - name: Sync Capacitor Android
        run: cd "$PROJECT_DIR" && npx cap sync android

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR/android"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dukaan-saathi-debug-apk
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
